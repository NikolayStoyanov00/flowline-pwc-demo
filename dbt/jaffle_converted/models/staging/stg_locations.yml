version: 2

models:
  - name: stg_locations
    description: >
      Converted from PowerCenter mapping m_FL_JS_STAGING_FULL,
      target STG.STG_LOCATIONS.
    columns:
      - name: location_id
        description: "varchar2(100,0) in PowerCenter"
        data_tests:
          - unique
          - not_null
      - name: location_name
        description: "varchar2(100,0) in PowerCenter"
      - name: opened_date
        description: "date(19,0) in PowerCenter"
      - name: tax_rate
        description: "number(p,s)(6,4) in PowerCenter"
      - name: region
        description: "varchar2(10,0) in PowerCenter"
