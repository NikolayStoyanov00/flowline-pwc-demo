version: 2

# Generated from the PowerCenter SOURCE definitions.
#
# `schema` defaults to the target schema, which is where the seed data
# lands, so the project runs self-contained. Against the real warehouse,
# point it at the Oracle schema instead:
#
#   dbt build --vars '{"raw_schema": "RAW"}'
sources:
  - name: raw
    description: Raw tables, from PowerCenter schema RAW.
    schema: "{{ var('raw_schema', target.schema) }}"
    tables:
      - name: RAW_CUSTOMERS
        identifier: raw_customers
        columns:
          - name: ID
            data_tests:
              - unique
              - not_null
          - name: NAME
            data_tests:
              - not_null
      - name: RAW_ITEMS
        identifier: raw_items
        columns:
          - name: ID
            data_tests:
              - unique
              - not_null
          - name: ORDER_ID
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'RAW_ORDERS')
                    field: ID
          - name: SKU
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'RAW_PRODUCTS')
                    field: SKU
      - name: RAW_ORDERS
        identifier: raw_orders
        columns:
          - name: ID
            data_tests:
              - unique
              - not_null
          - name: CUSTOMER
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'RAW_CUSTOMERS')
                    field: ID
      - name: RAW_PRODUCTS
        identifier: raw_products
        columns:
          - name: SKU
            data_tests:
              - unique
              - not_null
          - name: NAME
            data_tests:
              - not_null
      - name: RAW_STORES
        identifier: raw_stores
        columns:
          - name: ID
            data_tests:
              - unique
              - not_null
          - name: NAME
            data_tests:
              - not_null
      - name: RAW_SUPPLIES
        identifier: raw_supplies
        columns:
          - name: ID
            data_tests:
              - not_null
          - name: NAME
            data_tests:
              - not_null
          - name: SKU
            data_tests:
              - relationships:
                  arguments:
                    to: source('raw', 'RAW_PRODUCTS')
                    field: SKU
