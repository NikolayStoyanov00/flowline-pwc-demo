version: 2

models:
  - name: stg_orders
    description: >
      Converted from PowerCenter mapping m_FL_JS_STAGING_FULL,
      target STG.STG_ORDERS.
    columns:
      - name: order_id
        description: "varchar2(100,0) in PowerCenter"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "varchar2(100,0) in PowerCenter"
      - name: location_id
        description: "varchar2(100,0) in PowerCenter"
      - name: ordered_at_day
        description: "date(19,0) in PowerCenter"
      - name: subtotal_cents
        description: "number(15,0) in PowerCenter"
      - name: tax_paid_cents
        description: "number(15,0) in PowerCenter"
      - name: order_total_cents
        description: "number(p,s)(12,2) in PowerCenter"
      - name: subtotal
        description: "number(15,0) in PowerCenter"
      - name: tax_paid
        description: "number(15,0) in PowerCenter"
      - name: order_total
        description: "number(p,s)(12,2) in PowerCenter"
