version: 2

models:
  - name: stg_products
    description: >
      Converted from PowerCenter mapping m_FL_JS_STAGING_FULL,
      target STG.STG_PRODUCTS.
    columns:
      - name: product_id
        description: "varchar2(50,0) in PowerCenter"
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: "varchar2(100,0) in PowerCenter"
      - name: product_type
        description: "varchar2(50,0) in PowerCenter"
      - name: product_price_cents
        description: "number(15,0) in PowerCenter"
      - name: product_price
        description: "number(p,s)(12,2) in PowerCenter"
      - name: product_description
        description: "varchar2(500,0) in PowerCenter"
      - name: is_food_item
        description: "number(p,s)(1,0) in PowerCenter"
      - name: is_drink_item
        description: "number(p,s)(1,0) in PowerCenter"
