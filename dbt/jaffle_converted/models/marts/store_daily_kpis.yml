        description: "number(15,0) in PowerCenter"
      - name: revenue_total
        description: "number(p,s)(12,2) in PowerCenter"
      - name: subtotal_total
        description: "number(p,s)(12,2) in PowerCenter"
      - name: tax_total
        description: "number(p,s)(12,2) in PowerCenter"
      - name: cogs_total
        description: "number(p,s)(12,2) in PowerCenter"
      - name: gross_profit_total
        description: "number(p,s)(12,2) in PowerCenter"
      - name: gross_margin_pct
        description: "number(p,s)(10,4) in PowerCenter"
      - name: avg_order_value
        description: "number(p,s)(12,2) in PowerCenter"
      - name: high_value_orders
        description: "number(15,0) in PowerCenter"
