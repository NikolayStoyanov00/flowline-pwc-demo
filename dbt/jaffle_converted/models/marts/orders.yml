version: 2

models:
  - name: orders
    description: >
      Converted from PowerCenter mapping m_FL_JS_MARTS_CORE,
      target MART.ORDERS.
    columns:
      - name: order_id
        description: "varchar2(100,0) in PowerCenter"
      - name: customer_id
        description: "varchar2(100,0) in PowerCenter"
      - name: location_id
        description: "varchar2(100,0) in PowerCenter"
      - name: ordered_at_day
        description: "date(19,0) in PowerCenter"
      - name: subtotal
        description: "number(p,s)(12,2) in PowerCenter"
      - name: tax_paid
        description: "number(p,s)(12,2) in PowerCenter"
      - name: order_total
        description: "number(p,s)(12,2) in PowerCenter"
      - name: order_items_subtotal
        description: "number(p,s)(12,2) in PowerCenter"
      - name: order_cost
        description: "number(p,s)(12,2) in PowerCenter"
      - name: has_food_items
        description: "number(p,s)(1,0) in PowerCenter"
      - name: has_drink_items
        description: "number(p,s)(1,0) in PowerCenter"
      - name: customer_order_number
        description: "number(15,0) in PowerCenter"
